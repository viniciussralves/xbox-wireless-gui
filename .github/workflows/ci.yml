name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Python do sistema, com PyGObject)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-1 gir1.2-gtk-4.0 \
            libadwaita-1-0 gir1.2-adw-1 xvfb desktop-file-utils \
            appstream gettext python3-gi python3-cairo python3-evdev \
            python3-coverage python3-pip shellcheck
      - name: Python deps
        run: python3 -m pip install --user --break-system-packages ruff
      - name: Lint (erros reais)
        run: |
          python3 -m ruff check src tests --select F,E9
          shellcheck data/xbox-wireless-gui-helper \
            debian/wrapper debian/xbox-wireless-gui.postinst
          sh -n data/xbox-wireless-gui-helper
          bash -n packaging/aur/PKGBUILD
      - name: Compile
        run: python3 -m py_compile src/main.py src/backend/*.py tests/*.py
      - name: Unit tests + coverage (>=95% em src/)
        run: |
          xvfb-run -a python3 -m coverage run -m unittest discover -s tests -v
          python3 -m coverage report --fail-under=95 --include="src/*"
      - name: Validate desktop file
        run: desktop-file-validate data/com.github.xbox-wireless-gui.desktop
      - name: Validate AppData, schema, udev and XML
        run: |
          appstreamcli validate --no-net data/com.github.xbox-wireless-gui.metainfo.xml
          mkdir -p /tmp/xwg-schema && cp data/com.github.xbox-wireless-gui.gschema.xml /tmp/xwg-schema/
          glib-compile-schemas --strict --dry-run /tmp/xwg-schema
          udevadm verify data/71-xbox-wireless-gui.rules
          python3 -c "import xml.dom.minidom; [xml.dom.minidom.parse(f) for f in ['data/com.github.xbox-wireless-gui.metainfo.xml','data/com.github.xbox-wireless-gui.gschema.xml','data/com.github.xbox-wireless-gui.policy','data/com.github.xbox-wireless-gui.Helper.conf']]; print('XML OK')"
