name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-1 gir1.2-gtk-4.0 \
            libadwaita-1-0 gir1.2-adw-1 xvfb desktop-file-utils \
            appstream gettext python3-cairo
      - name: Python deps
        run: pip install evdev coverage ruff
      - name: Lint (erros reais)
        run: ruff check src tests --select F,E9
      - name: Compile
        run: python3 -m py_compile src/main.py src/backend/*.py tests/*.py
      - name: Unit tests + coverage (>=95% em src/)
        run: |
          xvfb-run -a python3 -m coverage run -m unittest discover -s tests -v
          python3 -m coverage report --fail-under=95 --include="src/*"
      - name: Validate desktop file
        run: desktop-file-validate data/com.github.xbox-wireless-gui.desktop
      - name: Validate AppData, schema, udev and XML
        run: |
          appstreamcli validate --no-net data/com.github.xbox-wireless-gui.metainfo.xml
          mkdir -p /tmp/xwg-schema && cp data/com.github.xbox-wireless-gui.gschema.xml /tmp/xwg-schema/
          glib-compile-schemas --strict --dry-run /tmp/xwg-schema
          udevadm verify data/71-xbox-wireless-gui.rules
          python3 -c "import xml.dom.minidom; [xml.dom.minidom.parse(f) for f in ['data/com.github.xbox-wireless-gui.metainfo.xml','data/com.github.xbox-wireless-gui.gschema.xml','data/com.github.xbox-wireless-gui.policy']]; print('XML OK')"
